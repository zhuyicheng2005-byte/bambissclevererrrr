<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>日语单词复习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #58cc02 0%, #89e219 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #58cc02;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            color: #666;
        }

        .mode-btn.active {
            background: white;
            color: #58cc02;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .mode-btn:hover:not(.active) {
            color: #58cc02;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e5e5e5;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #58cc02 0%, #89e219 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
            color: #777;
        }

        .card {
            background: #f7f7f7;
            border-radius: 15px;
            padding: 60px 40px;
            text-align: center;
            margin-bottom: 30px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .question {
            font-size: 80px;
            font-weight: bold;
            color: #1cb0f6;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .answer {
            font-size: 40px;
            color: #58cc02;
            margin-top: 20px;
            line-height: 1.3;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 18px 30px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-show {
            background: #1cb0f6;
            color: white;
        }

        .btn-show:hover {
            background: #1899d6;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(28, 176, 246, 0.3);
        }

        .btn-know {
            background: #58cc02;
            color: white;
        }

        .btn-know:hover {
            background: #4caf00;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(88, 204, 2, 0.3);
        }

        .btn-dont-know {
            background: #ff4b4b;
            color: white;
        }

        .btn-dont-know:hover {
            background: #e63946;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 75, 75, 0.3);
        }

        .btn-show:active, .btn-know:active, .btn-dont-know:active {
            transform: translateY(0);
        }

        .review-buttons {
            display: none;
        }

        .review-buttons.active {
            display: flex;
        }

        .completion-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .completion-screen.active {
            display: block;
        }

        .completion-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .completion-title {
            font-size: 32px;
            color: #58cc02;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .completion-stats {
            font-size: 18px;
            color: #777;
            margin-bottom: 30px;
        }

        .btn-restart {
            background: #58cc02;
            color: white;
            padding: 18px 50px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-restart:hover {
            background: #4caf00;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(88, 204, 2, 0.3);
        }

        .feedback {
            text-align: center;
            font-size: 16px;
            margin-top: 10px;
            min-height: 24px;
            font-weight: 500;
        }

        .feedback.correct {
            color: #58cc02;
        }

        .feedback.incorrect {
            color: #ff4b4b;
        }

        .keyboard-hint {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }

        .mode-indicator {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>日语单词复习</h1>
        
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('kanji-to-hiragana')">汉字→平假名</button>
            <button class="mode-btn" onclick="setMode('hiragana-to-kanji')">平假名→汉字</button>
            <button class="mode-btn" onclick="setMode('mixed')">混合模式</button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="stats-row">
            <span id="currentCount">0 / 0</span>
            <span id="reviewCount">待复习: 0</span>
        </div>

        <div id="reviewScreen">
            <div class="mode-indicator" id="modeIndicator"></div>
            <div class="card">
                <div class="question" id="question">准备开始...</div>
                <div class="answer hidden" id="answer">答案</div>
            </div>

            <div class="buttons" id="showButton">
                <button class="btn-show" onclick="showAnswer()">显示答案</button>
            </div>

            <div class="buttons review-buttons" id="reviewButtons">
                <button class="btn-dont-know" onclick="markDontKnow()">不记得</button>
                <button class="btn-know" onclick="markKnow()">记得</button>
            </div>

            <div class="feedback" id="feedback"></div>
            <div class="keyboard-hint">空格键：显示答案 | 1：不记得 | 2：记得</div>
        </div>

        <div class="completion-screen" id="completionScreen">
            <div class="completion-icon">🎉</div>
            <div class="completion-title">复习完成！</div>
            <div class="completion-stats" id="completionStats"></div>
            <button class="btn-restart" onclick="restart()">重新开始</button>
        </div>
    </div>

        ];

        let currentQueue = [];
        let reviewQueue = [];
        let currentIndex = 0;
        let totalReviewed = 0;
        let correctCount = 0;
        let answerShown = false;
        let reviewMode = 'kanji-to-hiragana'; // 'kanji-to-hiragana', 'hiragana-to-kanji', 'mixed'

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function setMode(mode) {
            reviewMode = mode;
            
            // Update button states
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Restart with new mode
            init();
        }

        function init() {
            currentQueue = shuffleArray([...vocabulary]);
            reviewQueue = [];
            currentIndex = 0;
            totalReviewed = 0;
            correctCount = 0;
            answerShown = false;
            
            document.getElementById('reviewScreen').style.display = 'block';
            document.getElementById('completionScreen').classList.remove('active');
            
            updateDisplay();
        }

        function getCurrentDirection() {
            if (reviewMode === 'mixed') {
                return Math.random() < 0.5 ? 'kanji-to-hiragana' : 'hiragana-to-kanji';
            }
            return reviewMode;
        }

        function updateDisplay() {
            if (currentIndex >= currentQueue.length) {
                if (reviewQueue.length > 0) {
                    currentQueue = shuffleArray([...reviewQueue]);
                    reviewQueue = [];
                    currentIndex = 0;
                } else {
                    showCompletion();
                    return;
                }
            }

            const word = currentQueue[currentIndex];
            const direction = getCurrentDirection();
            
            // Store direction for this word
            word._currentDirection = direction;
            
            if (direction === 'kanji-to-hiragana') {
                document.getElementById('question').textContent = word.kanji;
                document.getElementById('answer').textContent = word.hiragana;
                document.getElementById('modeIndicator').textContent = '看汉字，说平假名';
            } else {
                document.getElementById('question').textContent = word.hiragana;
                document.getElementById('answer').textContent = word.kanji;
                document.getElementById('modeIndicator').textContent = '看平假名，说汉字';
            }
            
            document.getElementById('answer').classList.add('hidden');
            
            document.getElementById('showButton').style.display = 'flex';
            document.getElementById('reviewButtons').classList.remove('active');
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            
            answerShown = false;
            updateStats();
        }

        function updateStats() {
            const total = vocabulary.length;
            document.getElementById('currentCount').textContent = `${totalReviewed} / ${total}`;
            document.getElementById('reviewCount').textContent = `待复习: ${reviewQueue.length}`;
            
            const progress = (totalReviewed / total) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showAnswer() {
            if (answerShown) return;
            
            document.getElementById('answer').classList.remove('hidden');
            document.getElementById('showButton').style.display = 'none';
            document.getElementById('reviewButtons').classList.add('active');
            answerShown = true;
        }

        function markKnow() {
            if (!answerShown) return;
            
            totalReviewed++;
            correctCount++;
            currentIndex++;
            
            const feedback = document.getElementById('feedback');
            feedback.textContent = '太棒了！';
            feedback.className = 'feedback correct';
            
            setTimeout(() => {
                updateDisplay();
            }, 500);
        }

        function markDontKnow() {
            if (!answerShown) return;
            
            totalReviewed++;
            reviewQueue.push(currentQueue[currentIndex]);
            currentIndex++;
            
            const feedback = document.getElementById('feedback');
            feedback.textContent = '没关系，稍后再复习';
            feedback.className = 'feedback incorrect';
            
            setTimeout(() => {
                updateDisplay();
            }, 500);
        }

        function showCompletion() {
            document.getElementById('reviewScreen').style.display = 'none';
            document.getElementById('completionScreen').classList.add('active');
            
            const accuracy = Math.round((correctCount / totalReviewed) * 100);
            document.getElementById('completionStats').innerHTML = 
                `完成 ${totalReviewed} 个单词<br>正确率: ${accuracy}%`;
        }

        function restart() {
            init();
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('completionScreen').classList.contains('active')) {
                if (e.key === 'Enter') {
                    restart();
                }
                return;
            }

            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                if (!answerShown) {
                    showAnswer();
                }
            } else if (e.key === '1') {
                if (answerShown) {
                    markDontKnow();
                }
            } else if (e.key === '2') {
                if (answerShown) {
                    markKnow();
                }
            }
        });

        init();
